workflows:
  ios-workflow:
    name: iOS Build Workflow
    # iOS builds require a macOS machine
    instance_type: mac_mini_m2 
    max_build_duration: 60
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'bA' # Replace with your specific branch name
          include: true
          source: true

    environment:
      groups:
        - app_store_credentials # Define your API keys in Codemagic UI first
      vars:
        XCODE_WORKSPACE: "YourApp.xcworkspace"
        XCODE_SCHEME: "YourAppScheme"

    scripts:
      - name: Install dependencies
        script: |
          cd ios && pod install
      - name: Build iOS IPA
        script: |
          # Use 'build-ipa' for distribution or 'build-ios' for testing
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
