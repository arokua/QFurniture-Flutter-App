# Raise heap so Gradle never OOMs on large transform tasks
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is the standard; Jetifier is NOT required for Flutter projects
# (all Flutter engine / plugin JARs are already AndroidX).
# Enabling it only causes slow, memory-hungry JetifyTransforms → OOM.
android.useAndroidX=true
android.enableJetifier=false

# Performance / correctness tweaks
org.gradle.unsafe.symlink-checking=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process